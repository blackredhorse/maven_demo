# ---- Gradle / Android ----
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Artifact coordinates ----
library.group=com.example
library.artifactId=mylibrary
library.version=1.0.0

# ---- GitHub Packages target ----
# The registry URL is built as https://maven.pkg.github.com/<owner>/<repo>
# Owner is a GitHub user or organization, repo is the repository that "owns" the package.
github.owner=blackredhorse
github.repo=maven_demo

# Credentials are NEVER stored here.
# Provide them through environment variables instead:
#   GITHUB_ACTOR = your GitHub username
#   GITHUB_TOKEN = a PAT with the "write:packages" scope (or the CI GITHUB_TOKEN)
# For local experiments you can put them in ~/.gradle/gradle.properties:
#   github.actor=your-github-name
#   github.token=ghp_xxxxxxxxxxxxxxxxxxxx
