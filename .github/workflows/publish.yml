name: Publish to GitHub Packages

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (defaults to the tag without the leading v)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            version="1.0.0-SNAPSHOT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing version $version"

      - name: Publish AAR + JAR
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :mylibrary:publishReleasePublicationToGitHubRepository \
            -Pgithub.owner="${{ github.repository_owner }}" \
            -Pgithub.repo="${{ github.event.repository.name }}" \
            -Plibrary.version="${{ steps.version.outputs.version }}"
